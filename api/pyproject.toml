[project]
name = "papertrade-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "psycopg[binary,pool]>=3.2,<4", "grpcio>=1.78,<2", "protobuf>=6.33.5,<8", "redis>=6,<8", "pydantic-settings>=2.8,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "grpcio-tools>=1.78,<2", "websocket-client>=1.8,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
extend-exclude = ["papertrade/generated", ".venv"]
[tool.ruff.lint]
select = ["E", "F", "I"]
