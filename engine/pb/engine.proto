syntax = "proto3";
package papertrade;
option go_package = "github.com/Sujendra-23/PaperTrade/engine/pb";
service MatchingEngine {
  rpc PlaceOrder(Order) returns (Result);
  rpc CancelOrder(Cancel) returns (Result);
  rpc GetBook(Symbol) returns (Snapshot);
  rpc StreamTrades(Symbol) returns (stream Trade);
  rpc Health(Empty) returns (EngineState);
  rpc Reset(Empty) returns (EngineState);
}
message Empty {}
message EngineState { string boot_id = 1; int64 commands = 2; }
message Symbol { string symbol = 1; }
message Order {
  string id = 1; string account_id = 2; string symbol = 3;
  string side = 4; string kind = 5; int64 price = 6; int64 quantity = 7;
}
message Cancel { string command_id = 1; string order_id = 2; string account_id = 3; string symbol = 4; }
message Trade {
  string id = 1; string symbol = 2; int64 price = 3; int64 quantity = 4;
  string buy_order_id = 5; string sell_order_id = 6;
  string buyer_id = 7; string seller_id = 8; int64 timestamp_ms = 9;
}
message Result { string order_id = 1; string status = 2; int64 remaining = 3; repeated Trade trades = 4; }
message Level { int64 price = 1; int64 quantity = 2; int64 orders = 3; }
message Snapshot { string symbol = 1; repeated Level bids = 2; repeated Level asks = 3; }
